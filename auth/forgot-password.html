<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Lost & Found Platform</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="./auth.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <div class="flex justify-between items-center mb-4">
        <a href="/" class="brand-logo">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
          </svg>
          Lost & Found
        </a>
        <button type="button" class="theme-toggle" onclick="toggleTheme()"></button>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send reset instructions</p>
      </div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-input" placeholder="student@lostfound.edu" required>
          <span class="form-error"></span>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-lg" style="width: 100%;">
          <span>Send Reset Link</span>
        </button>
      </form>

      <div class="auth-footer">
        Remembered password? <a href="./sign-in.html" class="font-semibold">Back to sign in</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { showToast, validateForm } from '../assets/js/utils.js';

    const form = document.getElementById('reset-form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!validateForm(form)) return;

      showToast('If an account exists, a password reset link has been dispatched.', 'info');
      setTimeout(() => { window.location.href = './sign-in.html'; }, 2000);
    });
  </script>
</body>
</html>
