<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Lost & Found Platform</title>
  <meta name="description" content="Create a new account on the Lost & Found campus platform.">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="./auth.css">
</head>
<body>

  <a href="../index.html" class="back-btn" title="Back to Home">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
  </a>

  <main class="auth-page">
    <div class="auth-card">
      <div class="flex justify-between items-center mb-4">
        <a href="/" class="brand-logo">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
          </svg>
          Lost & Found
        </a>
        <button type="button" class="theme-toggle" onclick="toggleTheme()"></button>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-subtitle">Join the campus Lost & Found network</p>
      </div>

      <form id="signup-form" novalidate>
        <div class="role-selector">
          <button type="button" class="role-btn active" data-role="student">Student User</button>
          <button type="button" class="role-btn" data-role="admin">Admin Moderator</button>
        </div>
        <input type="hidden" id="role" value="student">

        <div class="form-group">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="Alex Johnson" required>
          <span class="form-error"></span>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-input" placeholder="alex@campus.edu" required>
          <span class="form-error"></span>
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Phone Number (Optional)</label>
          <input type="tel" id="phone" class="form-input" placeholder="+1 (555) 019-2834">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Minimum 6 characters" required minlength="6">
          <span class="form-error"></span>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-lg" style="width: 100%;">
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="./sign-in.html" class="font-semibold">Sign in</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { handleSignUp } from './auth.js';
    import { validateForm } from '../assets/js/utils.js';

    const roleBtns = document.querySelectorAll('.role-btn');
    const roleInput = document.getElementById('role');

    roleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        roleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        roleInput.value = btn.getAttribute('data-role');
      });
    });

    const form = document.getElementById('signup-form');
    const submitBtn = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validateForm(form)) return;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const role = roleInput.value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner"></span> Creating account...`;

      await handleSignUp({ email, password, fullName, phone, role });

      submitBtn.disabled = false;
      submitBtn.innerHTML = `<span>Create Account</span>`;
    });
  </script>
</body>
</html>
