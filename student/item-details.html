<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Details - Lost & Found Platform</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="./student.css">
</head>
<body class="app-layout">

  <!-- Header -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="flex items-center gap-3">
        <a href="./index.html" class="nav-icon-btn" title="Back to Feed" aria-label="Back to Feed">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <a href="./index.html" class="brand-logo">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
          </svg>
          Campus Lost & Found
        </a>
      </div>

      <nav>
        <ul class="nav-secondary">
          <li>
            <a href="./profile.html#notifications" class="nav-icon-btn" title="Notifications" aria-label="Notifications">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
              <span id="unread-notes-count" class="notification-count-badge" style="display:none;">0</span>
            </a>
          </li>
          <li><button type="button" class="theme-toggle" onclick="toggleTheme()"></button></li>
          <li>
            <div class="profile-dropdown-container">
              <button type="button" class="user-badge-btn" id="profile-dropdown-trigger" onclick="toggleProfileMenu(event)" aria-expanded="false" aria-haspopup="true">
                <span class="user-avatar" id="nav-user-avatar">U</span>
                <span class="user-name" id="nav-user-name">User</span>
                <svg class="chevron-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M19 9l-7 7-7-7"/>
                </svg>
              </button>
              <div class="profile-menu" id="profile-dropdown-menu">
                <div class="profile-menu-header">
                  <span class="profile-menu-name" id="dropdown-user-name">User</span>
                  <span class="profile-menu-role" id="dropdown-user-role">Student</span>
                </div>
                <a href="./profile.html" class="profile-menu-item">
                  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                  Profile & My Reports
                </a>
                <a href="./profile.html#notifications" class="profile-menu-item">
                  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                  Notifications
                </a>
                <div class="profile-menu-divider"></div>
                <button type="button" class="profile-menu-item profile-menu-logout" onclick="handleLogout()">
                  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                  Sign Out
                </button>
              </div>
            </div>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container container-md">
      
      <a href="./index.html" class="btn btn-outline btn-sm mb-4">
        &larr; Back to Feed
      </a>

      <div id="item-details-container">
        <div class="flex justify-center py-8"><span class="spinner"></span> Loading item details...</div>
      </div>

    </div>
  </main>

  <!-- Modal: Claim Item -->
  <div id="modal-claim-item" class="modal-backdrop" aria-hidden="true">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Submit Claim & Ownership Verification</h2>
        <button class="modal-close" aria-label="Close modal">&times;</button>
      </div>

      <form id="form-claim-item" novalidate>
        <p class="text-sm text-secondary mb-4">
          To verify ownership, please provide exact proof details and answer the verification questions.
        </p>

        <div class="form-group">
          <label for="claim-proof" class="form-label">Proof of Ownership / Distinctive Marks</label>
          <textarea id="claim-proof" class="form-textarea" placeholder="Specify serial numbers, internal contents, unique marks, or stickers..." required></textarea>
        </div>

        <div class="form-group">
          <label for="claim-location-verification" class="form-label">Verification Question: Where/When did you lose this?</label>
          <input type="text" id="claim-location-verification" class="form-input" placeholder="State approximate date and exact area" required>
        </div>

        <div class="flex justify-between items-center mt-6">
          <button type="button" class="btn btn-outline" data-close-modal>Cancel</button>
          <button type="submit" id="btn-submit-claim" class="btn btn-primary">Submit Verification Claim</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Contact Owner -->
  <div id="modal-contact-owner" class="modal-backdrop" aria-hidden="true">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Contact Owner / Reporter</h2>
        <button class="modal-close" aria-label="Close modal">&times;</button>
      </div>

      <div id="contact-owner-body" class="flex flex-col gap-3">
        <!-- Loaded dynamically -->
      </div>

      <div class="mt-6 flex justify-end">
        <button type="button" class="btn btn-secondary" data-close-modal>Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { LocalDB } from '../assets/js/supabase.js';
    import { initTheme, toggleTheme, showToast, openModal, closeModal, formatDate, escapeHTML, getItemImage } from '../assets/js/utils.js';
    import { checkAuthGuard, handleLogout } from '../auth/auth.js';

    window.toggleTheme = toggleTheme;
    window.handleLogout = handleLogout;

    let currentItem = null;
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      currentUser = checkAuthGuard('student');
      if (!currentUser) return;

      const urlParams = new URLSearchParams(window.location.search);
      const itemId = urlParams.get('id');

      if (!itemId) {
        window.location.href = './index.html';
        return;
      }

      loadItemDetails(itemId);
      setupModalEvents(itemId);
    });

    function loadItemDetails(itemId) {
      currentItem = LocalDB.getItemById(itemId);
      const container = document.getElementById('item-details-container');

      if (!currentItem) {
        container.innerHTML = `<div class="empty-state"><h3>Item not found</h3></div>`;
        return;
      }

      const isOwner = String(currentItem.user_id) === String(currentUser.id);
      const isReturned = currentItem.status === 'returned';

      container.innerHTML = `
        <div class="item-detail-hero">
          <div>
            <img src="${escapeHTML(getItemImage(currentItem))}" alt="${escapeHTML(currentItem.title)}" class="item-detail-image" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?auto=format&fit=crop&w=600&q=80';">
          </div>

          <div class="flex flex-col justify-between">
            <div>
              <div class="flex items-center gap-2 mb-2">
                <span class="badge ${currentItem.item_type === 'lost' ? 'badge-lost' : 'badge-found'}">
                  ${currentItem.item_type.toUpperCase()}
                </span>
                <span class="badge badge-neutral">${escapeHTML(currentItem.status.toUpperCase())}</span>
                ${currentItem.is_ai_generated ? `<span class="badge badge-claimed">AI GENERATED</span>` : ''}
              </div>

              <h1 class="page-title mb-2">${escapeHTML(currentItem.title)}</h1>
              <p class="text-sm text-muted mb-4">Reported on ${formatDate(currentItem.reported_date)}</p>
              
              <div class="card mb-4" style="background-color: var(--bg-secondary);">
                <p class="text-sm text-primary">${escapeHTML(currentItem.description)}</p>
              </div>

              <div class="grid grid-cols-2 gap-2 text-sm mb-4">
                <div><strong>Category:</strong> ${escapeHTML(currentItem.category_name)}</div>
                <div><strong>Location:</strong> ${escapeHTML(currentItem.location_name)}</div>
                <div><strong>Color:</strong> ${escapeHTML(currentItem.color || 'N/A')}</div>
                <div><strong>Features:</strong> ${escapeHTML(currentItem.distinguishing_features || 'N/A')}</div>
              </div>
            </div>

            <div class="flex flex-col gap-2 mt-4 pt-4" style="border-top: 1px solid var(--border-subtle);">
              ${!isOwner && currentItem.status === 'active' ? (
                currentItem.item_type === 'found' ? `
                  <button id="btn-open-claim" class="btn btn-primary btn-lg" style="width: 100%;">
                    Submit Ownership Claim
                  </button>
                  <button id="btn-open-contact" class="btn btn-outline" style="width: 100%;">
                    Contact Finder
                  </button>
                ` : `
                  <button id="btn-open-contact" class="btn btn-primary btn-lg" style="width: 100%;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
                    I Found This Item / Contact Owner
                  </button>
                `
              ) : ''}

              ${isOwner ? `
                ${currentItem.status !== 'returned' ? `
                  <button id="btn-mark-returned" class="btn btn-primary btn-lg" style="width: 100%;">
                    Mark Item as Returned
                  </button>
                ` : ''}
                <button id="btn-delete-report" class="btn btn-danger btn-lg" style="width: 100%;">
                  Delete Report
                </button>
              ` : ''}

              ${isReturned ? `
                <div class="badge badge-returned" style="padding: 0.75rem; justify-content: center; font-size: 0.9rem;">
                  ✓ This item has been marked as returned to owner.
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;

      // Attach button clicks
      const btnClaim = document.getElementById('btn-open-claim');
      if (btnClaim) btnClaim.addEventListener('click', () => openModal('modal-claim-item'));

      const btnContact = document.getElementById('btn-open-contact');
      if (btnContact) btnContact.addEventListener('click', renderContactModal);

      const btnMark = document.getElementById('btn-mark-returned');
      if (btnMark) btnMark.addEventListener('click', handleMarkReturned);

      const btnDelete = document.getElementById('btn-delete-report');
      if (btnDelete) btnDelete.addEventListener('click', handleDeleteReport);
    }

    function renderContactModal() {
      const owner = currentItem.owner || { id: currentItem.user_id, full_name: 'Campus User', email: 'user@campus.edu' };
      const body = document.getElementById('contact-owner-body');
      const isLost = currentItem.item_type === 'lost';
      
      const renderChatMessages = () => {
        const msgs = LocalDB.getMessages(currentItem.id, currentUser.id, currentItem.user_id);
        if (msgs.length === 0) {
          return `<div class="empty-state" style="padding: 1rem;"><p class="text-xs text-muted">No messages yet. Type a message below to start chatting.</p></div>`;
        }
        return msgs.map(m => {
          const isMe = String(m.sender_id) === String(currentUser.id);
          return `
            <div style="align-self: ${isMe ? 'flex-end' : 'flex-start'}; max-width: 80%; margin-bottom: 0.5rem;">
              <div style="font-size: 0.7rem; color: var(--text-muted); text-align: ${isMe ? 'right' : 'left'}; margin-bottom: 0.15rem;">
                ${isMe ? 'You' : escapeHTML(m.sender_name)} • ${formatDate(m.created_at)}
              </div>
              <div style="background: ${isMe ? 'var(--brand-primary)' : 'var(--bg-tertiary)'}; color: ${isMe ? '#FFFFFF' : 'var(--text-primary)'}; padding: 0.5rem 0.75rem; border-radius: var(--radius-md); font-size: 0.875rem;">
                ${escapeHTML(m.message)}
              </div>
            </div>
          `;
        }).join('');
      };

      body.innerHTML = `
        <div class="card mb-3" style="background: var(--bg-secondary); padding: 0.75rem;">
          <p class="text-xs text-muted mb-1">${isLost ? 'Item Owner (Lost Report):' : 'Item Finder:'}</p>
          <h4 style="margin-bottom: 0.25rem;">${escapeHTML(owner.full_name)}</h4>
          <p class="text-xs">Email: <a href="mailto:${escapeHTML(owner.email)}">${escapeHTML(owner.email)}</a> | Phone: ${escapeHTML(owner.phone || 'Not provided')}</p>
        </div>

        <div id="chat-messages-container" class="flex flex-col" style="height: 220px; overflow-y: auto; padding: 0.5rem; background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); margin-bottom: 0.75rem;">
          ${renderChatMessages()}
        </div>

        <form id="chat-send-form" class="flex gap-2">
          <input type="text" id="chat-input" class="form-input" placeholder="Type your message..." required autocomplete="off" style="flex: 1;">
          <button type="submit" class="btn btn-primary btn-sm">Send</button>
        </form>
      `;

      openModal('modal-contact-owner');

      const chatContainer = document.getElementById('chat-messages-container');
      if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;

      const chatForm = document.getElementById('chat-send-form');
      if (chatForm) {
        chatForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const input = document.getElementById('chat-input');
          const text = input.value.trim();
          if (!text) return;

          LocalDB.sendMessage({
            item_id: currentItem.id,
            sender_id: currentUser.id,
            sender_name: currentUser.full_name || currentUser.email,
            receiver_id: currentItem.user_id,
            message: text
          });

          input.value = '';
          chatContainer.innerHTML = renderChatMessages();
          chatContainer.scrollTop = chatContainer.scrollHeight;
          showToast('Message sent!', 'success');
        });
      }
    }

    async function handleMarkReturned() {
      if (confirm('Are you sure you want to mark this item as successfully returned?')) {
        await LocalDB.saveItem({ ...currentItem, status: 'returned' });
        showToast('Item status updated to Returned!', 'success');
        loadItemDetails(currentItem.id);
      }
    }

    async function handleDeleteReport() {
      if (confirm('Are you sure you want to delete this report permanently?')) {
        LocalDB.deleteItem(currentItem.id);
        showToast('Report deleted successfully.', 'success');
        setTimeout(() => { window.location.href = './index.html'; }, 400);
      }
    }

    function setupModalEvents(itemId) {
      const closeBtns = document.querySelectorAll('.modal-close, [data-close-modal]');
      closeBtns.forEach(btn => btn.addEventListener('click', () => {
        const modal = btn.closest('.modal-backdrop');
        if (modal) closeModal(modal.id);
      }));

      const claimForm = document.getElementById('form-claim-item');
        let isClaimSubmitting = false;
        claimForm.addEventListener('submit', (e) => {
          e.preventDefault();
          if (isClaimSubmitting) return;

          const proof = document.getElementById('claim-proof')?.value.trim() || '';
          const verifyQ = document.getElementById('claim-location-verification')?.value.trim() || '';

          if (!proof || !verifyQ) {
            showToast('Please complete all verification details.', 'error');
            return;
          }

          isClaimSubmitting = true;
          try {
            LocalDB.saveClaim({
              item_id: itemId,
              claimer_id: currentUser?.id || 'anonymous',
              proof_description: proof,
              verification_answers: { location_details: verifyQ }
            });

            closeModal('modal-claim-item');
            claimForm.reset();
            showToast('Ownership claim submitted for verification!', 'success');

            // Send Notification to Item Owner
            if (currentItem && currentItem.user_id && typeof LocalDB.createNotification === 'function') {
              try {
                LocalDB.createNotification(
                  currentItem.user_id,
                  'New Claim Received',
                  `${currentUser?.full_name || 'A user'} submitted an ownership claim on your reported item "${currentItem.title}".`,
                  'info',
                  itemId
                );
              } catch (nErr) {
                console.warn("Claim notification notice:", nErr);
              }
            }
          } catch (err) {
            console.error("Error submitting claim:", err);
            showToast('Error submitting claim: ' + (err?.message || 'Unexpected error'), 'error');
          } finally {
            isClaimSubmitting = false;
          }
        });
      }
  </script>
</body>
</html>
