<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile & History - Lost & Found</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="./student.css">
</head>
<body class="app-layout">

  <!-- Header -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="./index.html" class="brand-logo">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
        </svg>
        Campus Lost & Found
      </a>

      <nav>
        <ul class="nav-links">
          <li>
            <a href="./index.html" class="btn btn-secondary btn-sm flex items-center gap-1">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              Home
            </a>
          </li>
          <li><a href="./profile.html" class="nav-link active">Profile & Reports</a></li>
          <li><button type="button" class="theme-toggle" onclick="toggleTheme()"></button></li>
          <li><button type="button" class="btn btn-outline btn-sm" onclick="handleLogout()">Sign Out</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <div class="card mb-6 flex justify-between items-center" style="background-color: var(--bg-elevated);">
        <div class="flex items-center gap-4">
          <div class="user-avatar" style="width: 54px; height: 54px; font-size: 1.5rem;" id="profile-avatar">U</div>
          <div>
            <h1 class="page-title" id="profile-name">User Name</h1>
            <p class="text-sm text-secondary" id="profile-email">user@campus.edu</p>
          </div>
        </div>
        <span class="badge badge-neutral" id="profile-role">STUDENT</span>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex gap-4 mb-6" style="border-bottom: 1px solid var(--border-subtle);">
        <button class="btn btn-secondary tab-btn active" data-tab="tab-reports">Report History</button>
        <button class="btn btn-secondary tab-btn" data-tab="tab-claims">Claims Submitted</button>
        <button class="btn btn-secondary tab-btn" data-tab="tab-messages">Direct Messages</button>
        <button class="btn btn-secondary tab-btn" data-tab="tab-notifications">Notifications</button>
      </div>

      <!-- TAB 1: Report History -->
      <section id="tab-reports" class="tab-content">
        <h2 class="mb-4">My Reported Items</h2>
        <div id="my-reports-list" class="flex flex-col gap-3"></div>
      </section>

      <!-- TAB 2: Claims Submitted -->
      <section id="tab-claims" class="tab-content" style="display: none;">
        <h2 class="mb-4">My Ownership Claims</h2>
        <div id="my-claims-list" class="flex flex-col gap-3"></div>
      </section>

      <!-- TAB 3: Direct Messages -->
      <section id="tab-messages" class="tab-content" style="display: none;">
        <h2 class="mb-4">My Conversations</h2>
        <div id="messages-list" class="flex flex-col gap-3"></div>
      </section>

      <!-- TAB 4: Notifications -->
      <section id="tab-notifications" class="tab-content" style="display: none;">
        <h2 class="mb-4">System Notifications</h2>
        <div id="notifications-list" class="flex flex-col gap-3"></div>
      </section>

    </div>
  </main>

  <script type="module">
    import { LocalDB } from '../assets/js/supabase.js';
    import { initTheme, toggleTheme, showToast, formatDate, escapeHTML } from '../assets/js/utils.js';
    import { checkAuthGuard, handleLogout } from '../auth/auth.js';

    window.toggleTheme = toggleTheme;
    window.handleLogout = handleLogout;

    let currentUser = null;

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      currentUser = checkAuthGuard('student');
      if (!currentUser) return;

      renderProfile();
      setupTabs();
      loadUserReports();
      loadUserClaims();
      loadUserNotifications();
      loadUserMessages();
    });

    function renderProfile() {
      document.getElementById('profile-name').textContent = currentUser.full_name || 'Campus Student';
      document.getElementById('profile-email').textContent = currentUser.email;
      document.getElementById('profile-role').textContent = currentUser.role.toUpperCase();
      document.getElementById('profile-avatar').textContent = (currentUser.full_name || currentUser.email).charAt(0).toUpperCase();
    }

    function setupTabs() {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');

          tab.classList.add('active');
          const target = tab.getAttribute('data-tab');
          document.getElementById(target).style.display = 'block';
        });
      });

      if (window.location.hash === '#notifications') {
        const notifTab = document.querySelector('[data-tab="tab-notifications"]');
        if (notifTab) notifTab.click();
      }
    }

    function loadUserReports() {
      const items = LocalDB.getItems().filter(i => String(i.user_id) === String(currentUser.id));
      const container = document.getElementById('my-reports-list');

      if (items.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>You haven't reported any lost or found items yet.</p></div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="card flex justify-between items-center" id="report-card-${item.id}">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="badge ${item.item_type === 'lost' ? 'badge-lost' : 'badge-found'}">${item.item_type}</span>
              <span class="badge badge-neutral">${item.status}</span>
              <span class="text-xs text-muted">${formatDate(item.created_at)}</span>
            </div>
            <h3 style="font-size: 1.1rem;">${escapeHTML(item.title)}</h3>
            <p class="text-sm text-secondary">${escapeHTML(item.location_name)} • ${escapeHTML(item.category_name)}</p>
          </div>
          <div class="flex gap-2">
            <a href="./item-details.html?id=${item.id}" class="btn btn-secondary btn-sm">View</a>
            ${item.status !== 'returned' ? `<button class="btn btn-primary btn-sm" onclick="markReturned('${item.id}')">Mark Returned</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteReport('${item.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    window.markReturned = (id) => {
      const item = LocalDB.getItemById(id);
      if (item && confirm(`Mark "${item.title}" as returned?`)) {
        LocalDB.saveItem({ ...item, status: 'returned' });
        showToast('Item status updated to Returned!', 'success');
        loadUserReports();
      }
    };

    window.deleteReport = (id) => {
      if (confirm('Are you sure you want to delete this post?')) {
        LocalDB.deleteItem(id);
        const card = document.getElementById(`report-card-${id}`);
        if (card) card.remove();
        showToast('Report deleted.', 'success');
        loadUserReports();
      }
    };

    function loadUserClaims() {
      const claims = LocalDB.getClaims().filter(c => c.claimer_id === currentUser.id);
      const container = document.getElementById('my-claims-list');

      if (claims.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>You haven't submitted any ownership claims.</p></div>`;
        return;
      }

      container.innerHTML = claims.map(c => `
        <div class="card flex justify-between items-center">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="badge badge-${c.status === 'approved' ? 'claimed' : c.status === 'rejected' ? 'lost' : 'neutral'}">${c.status.toUpperCase()}</span>
              <span class="text-xs text-muted">Submitted ${formatDate(c.created_at)}</span>
            </div>
            <h3 style="font-size: 1.1rem;">Item: ${escapeHTML(c.item?.title || 'Unknown Item')}</h3>
            <p class="text-sm text-secondary">Proof: ${escapeHTML(c.proof_description)}</p>
          </div>
        </div>
      `).join('');
    }

    function loadUserNotifications() {
      const notes = LocalDB.getNotifications(currentUser.id);
      const container = document.getElementById('notifications-list');

      if (notes.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>No notifications.</p></div>`;
        return;
      }

      container.innerHTML = notes.map(n => `
        <div class="card flex justify-between items-center" style="${!n.is_read ? 'border-left: 4px solid var(--brand-primary);' : ''}">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <strong>${escapeHTML(n.title)}</strong>
              <span class="text-xs text-muted">${formatDate(n.created_at)}</span>
            </div>
            <p class="text-sm text-secondary">${escapeHTML(n.message)}</p>
          </div>
          ${!n.is_read ? `<button class="btn btn-outline btn-sm" onclick="markRead('${n.id}')">Mark Read</button>` : ''}
        </div>
      `).join('');
    }

    window.markRead = (id) => {
      LocalDB.markNotificationRead(id);
      loadUserNotifications();
    };

    function loadUserMessages() {
      const convs = LocalDB.getUserConversations(currentUser.id);
      const container = document.getElementById('messages-list');
      if (!container) return;

      if (convs.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>No active conversations yet.</p></div>`;
        return;
      }

      container.innerHTML = convs.map(c => `
        <div class="card flex justify-between items-center" style="${c.unread ? 'border-left: 4px solid var(--brand-primary);' : ''}">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <strong>${escapeHTML(c.other_user_name)}</strong>
              <span class="badge badge-neutral">${escapeHTML(c.item_title)}</span>
              <span class="text-xs text-muted">${formatDate(c.last_message_time)}</span>
            </div>
            <p class="text-sm text-secondary" style="font-style: italic;">"${escapeHTML(c.last_message)}"</p>
          </div>
          <a href="./item-details.html?id=${c.item_id}" class="btn btn-primary btn-sm">Open Chat</a>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
